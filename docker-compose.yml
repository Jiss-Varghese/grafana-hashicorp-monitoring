services:

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: grafana-hashicorp-prometheus
    ports:
      - "9091:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    restart: unless-stopped

  consul:
    image: hashicorp/consul:latest
    container_name: grafana-hashicorp-consul
    ports:
      - "8700:8500"
    volumes:
      - ./consul/consul.hcl:/consul/config/consul.hcl:ro
    command:
      - "agent"
      - "-server"
      - "-bootstrap-expect=1"
      - "-ui"
      - "-client=0.0.0.0"
      - "-bind=0.0.0.0"
      - "-retry-join=consul2"
      - "-retry-join=consul3"
      - "-log-level=INFO"
    restart: unless-stopped
  consul2:
    image: hashicorp/consul:latest
    container_name: grafana-hashicorp-consul2
    ports:
      - "8701:8500"
    volumes:
      - ./consul/consul.hcl:/consul/config/consul.hcl:ro
    command:
      - "agent"
      - "-server"
      - "-bootstrap-expect=3"
      - "-node=consul-server-2"
      - "-ui"
      - "-client=0.0.0.0"
      - "-bind=0.0.0.0"
      - "-retry-join=consul"
      - "-retry-join=consul3"
      - "-log-level=INFO"
    restart: unless-stopped

  consul3:
    image: hashicorp/consul:latest
    container_name: grafana-hashicorp-consul3
    ports:
      - "8702:8500"
    volumes:
      - ./consul/consul.hcl:/consul/config/consul.hcl:ro
    command:
      - "agent"
      - "-server"
      - "-bootstrap-expect=3"
      - "-node=consul-server-3"
      - "-ui"
      - "-client=0.0.0.0"
      - "-bind=0.0.0.0"
      - "-retry-join=consul"
      - "-retry-join=consul2"
      - "-log-level=INFO"
    restart: unless-stopped
  vault:
    image: hashicorp/vault:latest
    container_name: grafana-hashicorp-vault
    ports:
      - "8201:8200"
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: "root"
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    command:
      - "server"
      - "-dev"
      - "-dev-root-token-id=root"
      - "-dev-listen-address=0.0.0.0:8200"
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.9.1
    container_name: grafana-hashicorp-node-exporter
    ports:
      - "9101:9100"
    restart: unless-stopped

  loki:
    image: grafana/loki:3.5.0
    container_name: grafana-hashicorp-loki
    ports:
      - "3101:3100"
    volumes:
      - ./loki/loki.yml:/etc/loki/config.yml:ro
    command:
      - "-config.file=/etc/loki/config.yml"
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.10.0
    container_name: grafana-hashicorp-alloy
    ports:
      - "12346:12345"
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/log:/var/log:ro
    command:
      - "run"
      - "--server.http.listen-addr=0.0.0.0:12345"
      - "/etc/alloy/config.alloy"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.1
    container_name: grafana-hashicorp-grafana
    ports:
      - "3001:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.28.1
    container_name: grafana-hashicorp-alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
    restart: unless-stopped

  nomad-server-1:
    image: hashicorp/nomad:2.0.7
    container_name: grafana-hashicorp-nomad-server-1
    ports:
      - "4646:4646"
      - "4647:4647"
      - "4648:4648"
    volumes:
      - ./nomad/cluster/server1.hcl:/etc/nomad.d/nomad.hcl:ro
    command:
      - "agent"
      - "-config=/etc/nomad.d/nomad.hcl"
      - "-log-level=INFO"
    networks:
      default:
      nomad-cluster:
        ipv4_address: 172.30.0.11
    restart: unless-stopped

  nomad-server-2:
    image: hashicorp/nomad:2.0.7
    container_name: grafana-hashicorp-nomad-server-2
    volumes:
      - ./nomad/cluster/server2.hcl:/etc/nomad.d/nomad.hcl:ro
    command:
      - "agent"
      - "-config=/etc/nomad.d/nomad.hcl"
      - "-log-level=INFO"
    networks:
      default:
      nomad-cluster:
        ipv4_address: 172.30.0.12
    restart: unless-stopped

  nomad-server-3:
    image: hashicorp/nomad:2.0.7
    container_name: grafana-hashicorp-nomad-server-3
    volumes:
      - ./nomad/cluster/server3.hcl:/etc/nomad.d/nomad.hcl:ro
    command:
      - "agent"
      - "-config=/etc/nomad.d/nomad.hcl"
      - "-log-level=INFO"
    networks:
      default:
      nomad-cluster:
        ipv4_address: 172.30.0.13
    restart: unless-stopped

  nomad-client-1:
    image: hashicorp/nomad:2.0.7
    container_name: grafana-hashicorp-nomad-client-1
    privileged: true
    cgroup: host
    volumes:
      - ./nomad/cluster/client1.hcl:/etc/nomad.d/nomad.hcl:ro
      - /var/run/docker.sock:/var/run/docker.sock
    command:
      - "agent"
      - "-config=/etc/nomad.d/nomad.hcl"
      - "-log-level=INFO"
    networks:
      - default
      - nomad-cluster
    restart: unless-stopped

  nomad-client-2:
    image: hashicorp/nomad:2.0.7
    container_name: grafana-hashicorp-nomad-client-2
    privileged: true
    cgroup: host
    volumes:
      - ./nomad/cluster/client2.hcl:/etc/nomad.d/nomad.hcl:ro
      - /var/run/docker.sock:/var/run/docker.sock
    command:
      - "agent"
      - "-config=/etc/nomad.d/nomad.hcl"
      - "-log-level=INFO"
    networks:
      - default
      - nomad-cluster
    restart: unless-stopped

volumes:
  grafana-data:
  vault-data:

networks:
  nomad-cluster:
    external: true