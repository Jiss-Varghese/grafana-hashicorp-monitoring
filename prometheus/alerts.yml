groups:

  - name: node-alerts
    rules:

      - alert: NodeExporterDown
        expr: up{job="node-exporter"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Node exporter is down"
          description: "Node exporter has been unavailable for more than 1 minute."

      - alert: HighCPUUsage
        expr: |
          100 * (
            1 - avg by(instance) (
              rate(node_cpu_seconds_total{job="node-exporter",mode="idle"}[5m])
            )
          ) > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage"
          description: "CPU usage is above 80% for more than 5 minutes."

      - alert: HighMemoryUsage
        expr: |
          (
            1 -
            node_memory_MemAvailable_bytes{job="node-exporter"}
            /
            node_memory_MemTotal_bytes{job="node-exporter"}
          ) * 100 > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage"
          description: "Memory usage is above 80% for more than 5 minutes."

      - alert: HighDiskUsage
        expr: |
          (
            1 -
            node_filesystem_avail_bytes{
              job="node-exporter",
              fstype!~"tmpfs|overlay"
            }
            /
            node_filesystem_size_bytes{
              job="node-exporter",
              fstype!~"tmpfs|overlay"
            }
          ) * 100 > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High disk usage"
          description: "Disk usage is above 80%."


   
  - name: nomad-alerts
    rules:
      - alert: NomadTargetDown
        expr: up{job="nomad"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Nomad target is down"
          description: "Nomad target {{ $labels.instance }} has been unavailable for more than 1 minute."
      - alert: NomadAllocationFailuresIncreasing
        expr: delta(nomad_nomad_job_summary_failed[5m]) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Nomad allocation failures increased"
          description: "Failed allocations for job {{ $labels.exported_job }} increased during the last 5 minutes."
  - name: consul-alerts
    rules:
      - alert: ConsulTargetDown
        expr: up{job="consul"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Consul target is down"
          description: "Consul target {{ $labels.instance }} has been unavailable for more than 1 minute."

  - name: vault-alerts
    rules:
      - alert: VaultTargetDown
        expr: up{job="vault"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Vault target is down"
          description: "Vault target {{ $labels.instance }} has been unavailable for more than 1 minute."       


  
 